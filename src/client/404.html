<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Vevfrontgame</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 2rem;
    }

    h1 {
      font-size: 8rem;
      margin: 0;
      background: linear-gradient(45deg, #0075ff, #00a3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(0, 163, 255, 0.5);
    }

    h2 {
      font-size: 2rem;
      margin: 1rem 0;
      font-weight: 300;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.8;
      margin: 1.5rem 0;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #0075ff, #00a3ff);
      border-radius: 0.5rem;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 117, 255, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 117, 255, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo {
      width: 200px;
      height: auto;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    .floating {
      animation: float 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="floating">
      <h1>404</h1>
    </div>
    <h2>Battle Not Found</h2>
    <p>
      The battlefield you're looking for doesn't exist. 
      It may have been moved, deleted, or never existed at all.
    </p>
    <div class="buttons">
      <a href="/" class="btn">Return to Base</a>
      <!--<a href="/join" class="btn btn-secondary">Join a Battle</a> -->
    </div>
  </div>

  <script>
    // Redirection automatique après 10 secondes
    setTimeout(() => {
      window.location.href = '/';
    }, 10000);

    // Gestion de la langue pour la redirection
    const path = window.location.pathname;
    const langMatch = path.match(/^\/([a-z]{2}(-[a-z]{2})?)\//);
    if (langMatch) {
      const lang = langMatch[1];
      document.querySelectorAll('.btn').forEach(btn => {
        const href = btn.getAttribute('href');
        if (href === '/') {
          btn.setAttribute('href', `/${lang}`);
        }
      });
    }
  </script>
</body>
</html>
